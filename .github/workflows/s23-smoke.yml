name: S23 clone engine smoke build
on:
  push:
    branches: [smoke/s23-android16]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264' 'cmake;3.22.1'
      - name: Build isolated 64-bit test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleFastApp64Debug
      - name: Inspect install and signer
        run: |
          APK=app/build/outputs/apk/FastApp64/debug/app-FastApp64-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -E 'package:|sdkVersion:|targetSdkVersion:|native-code:|uses-permission:' "$RUNNER_TEMP/badging.txt"
          python3 - "$RUNNER_TEMP/badging.txt" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          permissions = re.findall(r"uses-permission: name='([^']+)'", text)
          allowed = {'android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE'}
          assert set(permissions) <= allowed, permissions
          assert "targetSdkVersion:'35'" in text
          print('permission audit passed:', permissions)
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E 'android:(debuggable|usesCleartextTraffic|allowBackup)|MANAGE_EXTERNAL_STORAGE' || true
      - uses: actions/upload-artifact@v4
        with:
          name: s23-clone-smoke-debug
          path: app/build/outputs/apk/FastApp64/debug/*.apk
          if-no-files-found: error
